name: Sandbox CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sandbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify patch formatting
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Verify TP-01 evidence file when present
        shell: bash
        run: |
          if [ -e evidence/tp01-first-publication.txt ]; then
            test -f evidence/tp01-first-publication.txt
            grep -Fxq 'Trusted Publisher TP-01 live sandbox candidate' evidence/tp01-first-publication.txt
          fi
